name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract zip files if exists
        run: |
          for f in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Unzipping $f..."
            unzip -o "$f"
          done

      - name: Locate and Build Flutter Project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Moving to project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # تعطيل الخيارات المتعارضة في gradle.properties
          if [ -f "android/gradle.properties" ]; then
            sed -i '/android.newDsl/d' android/gradle.properties
            sed -i '/android.defaults.buildfeatures.buildconfig/d' android/gradle.properties
            echo "android.newDsl=false" >> android/gradle.properties
            echo "org.gradle.warning.mode=none" >> android/gradle.properties
          fi

          # حل تعارض المكتبة
          flutter pub add share_plus:^12.0.2
          flutter pub get

          # البناء مع إلغاء التحقق الصارم من AGP
          flutter build apk --debug --no-tree-shake-icons --build-name=1.0.0 --build-number=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
