name: Build Flutter APK - Kibriya Chat

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project Files
      run: |
        find . -name "*.zip" -exec unzip -o {} \; || true
        BUILD_FILE=$(find . -name "pubspec.yaml" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          TARGET_DIR=$(dirname "$BUILD_FILE")
          if [ "$TARGET_DIR" != "." ]; then
            cp -rn "$TARGET_DIR"/* . || true
          fi
        fi

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter (Latest Stable)
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Fix pubspec constraints & Resolve Dependencies
      run: |
        # تعديل شرط إصدار الفلوتر واللينت تلقائياً لمنع أي تعارض
        sed -i 's/sdk: ">=3.29.0/sdk: ">=3.0.0/g' pubspec.yaml || true
        sed -i 's/flutter: ">=3.29.0/flutter: ">=3.0.0/g' pubspec.yaml || true
        flutter pub remove flutter_lints || true
        flutter pub add share_plus:^12.0.2 || true
        flutter pub add zego_uikit_prebuilt_live_audio_room:^3.16.6 || true
        flutter pub get

    - name: Build Debug APK
      run: flutter build apk --debug --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KibriyaChat-APK
        path: "**/build/app/outputs/flutter-apk/*.apk"
