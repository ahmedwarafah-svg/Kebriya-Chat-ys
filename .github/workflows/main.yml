name: Build Android APK - Kibriya Chat

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Extract and Setup Project Files
      run: |
        echo "=== Extracting all zip files ==="
        find . -name "*.zip" -exec unzip -o {} \; || true
        
        echo "=== Locating build.gradle ==="
        BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        
        if [ -n "$BUILD_FILE" ]; then
          TARGET_DIR=$(dirname "$BUILD_FILE")
          echo "Found project directory at: $TARGET_DIR"
          if [ "$TARGET_DIR" != "." ]; then
            echo "Copying files to root..."
            cp -rn "$TARGET_DIR"/* . || true
          fi
        else
          echo "No build.gradle found, initializing dummy wrapper..."
          gradle init --type basic --dsl groovy --project-name KibriyaChat --overwrite
        fi

    - name: Make Gradlew Executable
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug || ./gradlew build
        else
          gradle assembleDebug || gradle build
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KibriyaChat-app-debug
        path: "**/*.apk"
