name: Build Flutter APK - Kibriya Chat

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project Files
      run: |
        find . -name "*.zip" -exec unzip -o {} \; || true
        BUILD_FILE=$(find . -name "pubspec.yaml" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          TARGET_DIR=$(dirname "$BUILD_FILE")
          if [ "$TARGET_DIR" != "." ]; then
            cp -rn "$TARGET_DIR"/* . || true
          fi
        fi

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Auto-Fix Dart Code & Build Settings
      run: |
        # 1. إصلاح قيود الإصدارات في pubspec.yaml
        sed -i 's/sdk: ">=3.29.0/sdk: ">=3.0.0/g' pubspec.yaml || true
        sed -i 's/flutter: ">=3.29.0/flutter: ">=3.0.0/g' pubspec.yaml || true
        flutter pub remove flutter_lints || true
        flutter pub add share_plus:^12.0.2 || true
        flutter pub add zego_uikit_prebuilt_live_audio_room:^3.16.6 || true
        flutter pub get

        # 2. إصلاح خطأ roomId في ملف cinema.dart
        if [ -f "lib/screens/cinema.dart" ]; then
          sed -i 's/\$roomId/\${widget.roomId}/g' lib/screens/cinema.dart || true
          sed -i 's/roomId/widget.roomId/g' lib/screens/cinema.dart || true
        fi

        # 3. إصلاح أخطاء الشروط والأنواع في room_tools.dart و wealth.dart
        if [ -f "lib/screens/room_tools.dart" ]; then
          sed -i 's/if(ok!=true)/if(ok!=null)/g' lib/screens/room_tools.dart || true
          sed -i 's/if (ok != true)/if (ok != null)/g' lib/screens/room_tools.dart || true
        fi

        # 4. رفع minSdkVersion لـ 21 في جميع ملفات build.gradle
        find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/g' {} + || true
        find android/ -name "build.gradle.kts" -exec sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' {} + || true

        # 5. ضبط إعدادات الذاكرة للـ Gradle
        if [ -f "android/gradle.properties" ]; then
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
        fi

    - name: Build Debug APK
      run: flutter build apk --debug --no-tree-shake-icons --android-skip-build-dependency-validation

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KibriyaChat-APK
        path: "**/build/app/outputs/flutter-apk/*.apk"
