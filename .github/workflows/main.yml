name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          if [ -f kibriya-chat-v10.1-android-ready.zip ]; then
            unzip -o kibriya-chat-v10.1-android-ready.zip
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Dependencies Automatically
        run: |
          sed -i 's/sdk: ">=3.29.0 <4.0.0"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml || true
          flutter pub add share_plus:^12.0.2 || true
          flutter pub get || true

      - name: Build Debug APK
        run: |
          flutter build apk --debug --no-tree-shake-icons || true
