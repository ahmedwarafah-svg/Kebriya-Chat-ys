name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          if [ -f kibriya-chat-v10.1-android-ready.zip ]; then
            unzip -o kibriya-chat-v10.1-android-ready.zip
          elif [ -f *.zip ]; then
            unzip -o *.zip
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Patch Android Configs & Dependencies
        run: |
          # 1. إصلاح قيود pubspec وربط المكتبات المتعارضة
          sed -i 's/sdk: ">=3.29.0 <4.0.0"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml || true
          flutter pub add share_plus:^12.0.2 || true
          flutter pub get || true

          # 2. تعديل ملف android/app/build.gradle لتوافق Java 17 و minSdkVersion
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle || true
          fi

          # 3. تعديل ملف android/build.gradle لرفع إصدار Kotlin و Gradle Plugin
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.24'/g" android/build.gradle || true
          fi

      - name: Build APK
        run: |
          flutter build apk --debug --no-tree-shake-icons --no-pub --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kibriya-chat-apk
          path: build/app/outputs/flutter-apk/*.apk
