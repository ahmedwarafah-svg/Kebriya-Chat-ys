name: Build Flutter APK - Kibriya Chat

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project Files
      run: |
        find . -name "*.zip" -exec unzip -o {} \; || true
        BUILD_FILE=$(find . -name "pubspec.yaml" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          TARGET_DIR=$(dirname "$BUILD_FILE")
          if [ "$TARGET_DIR" != "." ]; then
            cp -rn "$TARGET_DIR"/* . || true
          fi
        fi

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Auto-Fix AGP & Dart Code Dependencies
      run: |
        # 1. تحديث القيود والاعتماديات
        sed -i 's/sdk: ">=3.29.0/sdk: ">=3.0.0/g' pubspec.yaml || true
        sed -i 's/flutter: ">=3.29.0/flutter: ">=3.0.0/g' pubspec.yaml || true
        flutter pub remove flutter_lints || true
        flutter pub add share_plus:^12.0.2 || true
        flutter pub add zego_uikit_prebuilt_live_audio_room:^3.16.6 || true
        flutter pub get

        # 2. حل مشكلة Gradle AGP الموضحة في الفيديو
        if [ -f "android/build.gradle" ]; then
          sed -i 's/com.android.tools.build:gradle:8.7.3/com.android.tools.build:gradle:8.9.1/g' android/build.gradle || true
        fi
        if [ -f "android/settings.gradle" ]; then
          sed -i 's/8.7.3/8.9.1/g' android/settings.gradle || true
        fi

        # 3. إيقاف فحص AGP Strict وتجاوز الأخطاء
        if [ -f "android/gradle.properties" ]; then
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "android.overridePathCheck=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
        fi

        # 4. رفع minSdkVersion لـ 21 لضمان عمل Zego
        find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/g' {} + || true
        find android/ -name "build.gradle.kts" -exec sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' {} + || true

        # 5. إصلاح أخطاء الكود الموضحة بالفيديو (room_tools / cinema)
        if [ -f "lib/screens/room_tools.dart" ]; then
          sed -i 's/if(ok!=null)/if(ok != null \&\& ok != 0)/g' lib/screens/room_tools.dart || true
        fi

    - name: Build Debug APK
      run: flutter build apk --debug --no-tree-shake-icons --android-skip-build-dependency-validation

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KibriyaChat-APK
        path: "**/build/app/outputs/flutter-apk/*.apk"
