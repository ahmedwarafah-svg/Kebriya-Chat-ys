name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract zip files if exists
        run: |
          for f in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Unzipping $f..."
            unzip -o "$f"
          done

      - name: Locate and Build Flutter Project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Moving to project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # إجبار تحديث مكتبة share_plus لتوافق ZegoUIKit
          flutter pub add share_plus:^12.0.2
          flutter pub get
          flutter build apk --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
