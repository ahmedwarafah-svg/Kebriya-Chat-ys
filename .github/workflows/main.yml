name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          if [ -f kibriya-chat-v10.1-android-ready.zip ]; then
            unzip -o kibriya-chat-v10.1-android-ready.zip
          elif [ -f *.zip ]; then
            unzip -o *.zip
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix pubspec SDK constraint
        run: |
          sed -i 's/sdk: ">=3.29.0 <4.0.0"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug --no-tree-shake-icons --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kibriya-chat-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
