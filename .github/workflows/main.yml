name: Build Android APK - Kibriya Chat

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Unzip Project
      run: |
        unzip -o kibriya-chat-v10-secure*.zip || true
        # البحث عن ملف build.gradle ونقل المحتويات إلى المجلد الرئيسي
        FOUND_DIR=$(find . -maxdepth 3 -name "build.gradle" -exec dirname {} \;)
        if [ -n "$FOUND_DIR" ] && [ "$FOUND_DIR" != "." ]; then
          echo "Found project at $FOUND_DIR, copying files to root..."
          cp -r $FOUND_DIR/* . || true
        fi

    - name: Make Gradlew Executable
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KibriyaChat-app-debug
        path: "**/build/outputs/apk/debug/*.apk"
