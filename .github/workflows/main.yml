name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract zip files if exists
        run: |
          for f in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Unzipping $f..."
            unzip -o "$f"
          done

      - name: Locate and Build Flutter Project
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Moving to project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 1. ترقية Gradle إلى 8.14 لتلبية الحد الأدنى المطلوبة من Flutter
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-.*-all.zip/gradle-8.14-all.zip/g' {} +
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-.*-bin.zip/gradle-8.14-bin.zip/g' {} +

          # 2. تعطيل newDsl و builtInKotlin في كل ملفات gradle.properties لحل التعارض
          find . -name "gradle.properties" -exec sh -c '
            sed -i "/android.newDsl/d" "$1"
            sed -i "/android.builtInKotlin/d" "$1"
            echo "android.newDsl=false" >> "$1"
            echo "android.builtInKotlin=false" >> "$1"
          ' _ {} \;

          # 3. إعطاء صلاحيات التشغيل للـ gradlew
          find . -name "gradlew" -exec chmod +x {} + || true

          # 4. تحديث المكتبات وبناء الـ APK
          flutter pub add share_plus:^12.0.2
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
